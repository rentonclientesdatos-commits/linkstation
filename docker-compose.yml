version: '3.8'

services:
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
        - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    container_name: af-dashboard
    restart: always
    ports:
      - "8500:8500"
    environment:
      - NODE_ENV=production
      - PORT=8500
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_JWT_SECRET=${SUPABASE_JWT_SECRET}
      - REDIS_URL=redis://redis:6379
    labels:
      # Traefik: aumentar límite de body a 30MB para permitir uploads de PDFs (parse-menu)
      - "traefik.http.middlewares.dashboard-bodylimit.buffering.maxRequestBodyBytes=31457280"
      - "traefik.http.middlewares.dashboard-bodylimit.buffering.maxResponseBodyBytes=31457280"
      - "traefik.http.middlewares.dashboard-bodylimit.buffering.memRequestBodyBytes=31457280"
      - "traefik.http.routers.af-dashboard.middlewares=dashboard-bodylimit"
    depends_on:
      redis:
        condition: service_healthy


  # ── BullMQ Worker (Separate process for queue processing) ──────────
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: af-worker
    restart: always
    command: node worker.js
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - SUPABASE_JWT_SECRET=${SUPABASE_JWT_SECRET}
      - REDIS_URL=redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
      dashboard:
        condition: service_started

  # ── Redis: Persistent Queue Storage ───────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: af-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis_data:
    driver: local
